plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.sstamilschool'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') { useJUnitPlatform() }

// Make `./gradlew bootRun` work out of the box by loading the local env vars from
// .vscode/launch.json (the single source of truth for dev credentials). Without this,
// bootRun forks a JVM with no DB_* vars and the app dies with
// "password authentication failed for user ${DB_USERNAME}".
// launch.json is JSONC (has // comments), so strip them before strict JSON parsing.
tasks.named('bootRun', JavaExec) {
    doFirst {
        def launchFile = file('.vscode/launch.json')
        if (launchFile.exists()) {
            try {
                def text = launchFile.text.replaceAll(/(?m)^\s*\/\/.*$/, '')
                def envMap = new groovy.json.JsonSlurper().parseText(text).configurations[0].env
                if (envMap) {
                    envMap.each { k, v -> environment k, v }
                }
            } catch (Exception e) {
                logger.lifecycle("WARN: could not read env from .vscode/launch.json (${e.message}); " +
                                 "bootRun will use ambient environment variables.")
            }
        }
    }
}

task executeSchema(type: Exec) {
    description 'Execute SQL schema file against PostgreSQL'
    def dbHost = System.getenv('DB_HOST') ?: 'dpg-dappla49v7es739g7rrg-a'
    def dbPort = System.getenv('DB_PORT') ?: '5432'
    def dbName = System.getenv('DB_NAME') ?: 'ssts_pr'
    def dbUser = System.getenv('DB_USERNAME') ?: ''
    def dbPass = System.getenv('DB_PASSWORD') ?: ''
    commandLine 'psql', '-h', dbHost, '-p', dbPort, '-U', dbUser, '-d', dbName, '-f', 'sql/schema.sql'
    environment 'PGPASSWORD', dbPass
}
