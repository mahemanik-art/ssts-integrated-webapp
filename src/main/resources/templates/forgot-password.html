<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot password | Sandy Springs Tamil School</title>
    <link rel="stylesheet" th:href="@{/css/site.css}" />
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
    <link rel="stylesheet" th:href="@{/css/midnight-teal.css}" />
    <link rel="stylesheet" th:href="@{/css/school-template.css}" />
    <link rel="stylesheet" th:href="@{/css/dark-gold.css}" />
    <link rel="stylesheet" th:href="@{/css/welcoming-template.css}" />
    <link rel="stylesheet" th:href="@{/css/fullscreen-dark.css}" />
    <link rel="stylesheet" th:href="@{/css/floating-logo.css}" />
    <link rel="stylesheet" th:href="@{/css/logo-size.css}" />
    <link rel="stylesheet" th:href="@{/css/logo-size-large.css}" />
    <link rel="stylesheet" th:href="@{/css/hero-compact.css}" />
    <link rel="stylesheet" th:href="@{/css/hero-background.css}" />
    <link rel="stylesheet" th:href="@{/css/logo-palette.css}" />
    <link rel="stylesheet" th:href="@{/css/logo-recolor.css}" />
    <link rel="stylesheet" th:href="@{/css/hero-full.css}" />
    <link rel="stylesheet" th:href="@{/css/levels.css}" />
    <link rel="stylesheet" th:href="@{/css/donors.css}" />
    <style>
      .login-form {
        max-width: 380px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }
      .login-form .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .login-form label {
        text-align: left;
        font-weight: 600;
        color: #fff;
      }
      .login-form input {
        width: 100%;
        padding: 0.65rem 0.85rem;
        border: 1px solid #b9c5c8;
        border-radius: 6px;
        font-size: 0.95rem;
        font-family: 'Source Sans 3', sans-serif;
        background: #0f2029;
        color: #edf7fb;
      }
      .login-form .button {
        align-self: flex-start;
      }
      .login-form .button.secondary {
        background: transparent;
        color: #fff6e6;
        border: 2px solid #ffcf45;
      }
      .login-form .button.secondary:hover {
        background: rgba(255, 207, 69, 0.12);
        color: #ffcf45;
        border-color: #ffcf45;
      }
      .login-form .text-link {
        color: #ffcf45;
        text-decoration: underline;
      }
      .login-form .alert {
        padding: 0.7rem 1rem;
        border-radius: 6px;
      }
    .alert-error {
      background: rgba(213, 66, 45, 0.15);
      color: #f3a833;
      border: 1px solid #f3a833;
    }
    .alert-success {
      background: rgba(112, 214, 199, 0.15);
      color: #a6eee4;
      border: 1px solid #a6eee4;
    }
      .alert-success {
        background: rgba(112, 214, 199, 0.15);
        color: #a6eee4;
        border: 1px solid #a6eee4;
      }
    </style>
  </head>
  <body class="school-home">
    <section class="donor-marquee" aria-label="">
      <div class="marquee-track"></div>
    </section>

    <header class="template-header wrap">
      <a href="/" class="header-logo">
        <img th:src="@{/images/ssts-logo.png}" alt="Sandy Springs Tamil School logo" />
      </a>
      <nav aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/calendar">Calendar</a>
        <a href="/team">Our Team</a>
        <a href="/contact">Contact</a>
      </nav>
    </header>

    <main>
      <section class="intro-section wrap">
        <div>
          <p class="eyebrow accent">RESET YOUR PASSWORD</p>
          <h2>Forgot your password?</h2>
        </div>
        <div>
          <form th:action="@{/forgot-password}" method="post" class="login-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

            <th:block th:if="${message == null}">
              <p style="color: #dbe8ef; font-size: 0.92rem">
                Enter the email address tied to your account and we'll send you a link to reset your password.
              </p>

              <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required tabindex="1" />
              </div>

              <div class="form-actions" style="display: flex; align-items: center; gap: 0.75rem; margin-top: 0.5rem">
                <button type="submit" class="button" tabindex="2">Send reset link</button>
                <a th:href="@{/login}" class="text-link" tabindex="3">Back to login</a>
              </div>
            </th:block>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <div class="wrap">
        <strong>Sandy Springs Tamil School</strong>
        <span>4896 N Peachtree Rd, Dunwoody, GA 30338 · Friday evenings, 7:00–8:15 PM</span>
      </div>
    </footer>
  </body>
</html>
