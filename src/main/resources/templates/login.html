<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Sandy Springs Tamil School</title>
  <link rel="stylesheet" th:href="@{/css/site.css}" />
  <link rel="stylesheet" th:href="@{/css/theme.css}" />
  <link rel="stylesheet" th:href="@{/css/midnight-teal.css}" />
  <link rel="stylesheet" th:href="@{/css/school-template.css}" />
  <link rel="stylesheet" th:href="@{/css/dark-gold.css}" />
  <link rel="stylesheet" th:href="@{/css/welcoming-template.css}" />
  <link rel="stylesheet" th:href="@{/css/fullscreen-dark.css}" />
  <link rel="stylesheet" th:href="@{/css/floating-logo.css}" />
  <link rel="stylesheet" th:href="@{/css/logo-size.css}" />
  <link rel="stylesheet" th:href="@{/css/logo-size-large.css}" />
  <link rel="stylesheet" th:href="@{/css/hero-compact.css}" />
  <link rel="stylesheet" th:href="@{/css/hero-background.css}" />
  <link rel="stylesheet" th:href="@{/css/logo-palette.css}" />
  <link rel="stylesheet" th:href="@{/css/logo-recolor.css}" />
  <link rel="stylesheet" th:href="@{/css/hero-full.css}" />
  <link rel="stylesheet" th:href="@{/css/levels.css}" />
  <link rel="stylesheet" th:href="@{/css/donors.css}" />
</head>
<body class="college-home">
  <section class="donor-marquee" aria-label="">
    <div class="marquee-track"></div>
  </section>

  <header class="template-header wrap">
    <a href="/" class="header-logo">
      <img th:src="@{/images/ssts-logo.png}" alt="Sandy Springs Tamil School logo" />
    </a>
    <nav aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/calendar">Calendar</a>
      <a href="/team">Our Team</a>
      <a href="/contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="intro-section wrap">
      <div>
        <p class="eyebrow accent">ACCESS YOUR ACCOUNT</p>
        <h2>Welcome back to SSTS</h2>
      </div>
      <div>
        <form th:action="@{/login}" method="post" class="login-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

          <div class="form-group">
            <label for="username">Username or Email</label>
            <input type="text" id="username" name="username" required autofocus />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>

          <button type="submit" class="button">Login</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <strong>Sandy Springs Tamil School</strong>
      <span>1978 Mt. Vernon Rd, Dunwoody, GA 30338 · Friday evenings, 7:00–8:15 PM</span>
    </div>
  </footer>
</body>
</html>
