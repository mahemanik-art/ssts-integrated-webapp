# Development profile (default when SPRING_PROFILES_ACTIVE is unset).
# Verbose SQL and schema auto-update; templates are re-read so edits show without a restart.
# Local dev credentials live in .vscode/launch.json.

spring:
  thymeleaf:
    cache: false
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    show-sql: ${DB_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${DB_FORMAT_SQL:true}
